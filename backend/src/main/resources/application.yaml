spring:
  application:
    name: ronde-security

  # PostgreSQL
  datasource:
    url: "jdbc:postgresql://${MYSQL_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:ronde_security}"
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:selesy20}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  address: 0.0.0.0
  port: ${PORT:8022}

# MQTT
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:ronde-security-backend}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  data-topic: ronde/boitier/+/data
  ack-topic-prefix: ronde/boitier/

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

# JWT
jwt:
  secret: ${JWT_SECRET:nvz7Y2UYw8KPbHut3vCoq32UpzlXU6U8sIxHWCva1r8=}
  expiration: 3600000

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
